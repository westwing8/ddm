<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>훈련원터 주변 답사</title>
<style>
:root{--pri:#2563eb;--fg:#111827;--muted:#6b7280;--bd:#d9dce1;--soft:#f6f7f9}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color:var(--fg);background:#fff;line-height:1.6;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--bd)}
.brand{padding:10px 14px 6px;font-weight:700;font-size:15px}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:0 10px 8px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:0 0 auto;font:inherit;font-size:13px;line-height:1;width:34px;padding:10px 0;
 text-align:center;border:1px solid var(--bd);background:#fff;color:var(--fg);border-radius:6px}
#tabs button[data-r="home"]{width:62px}
#tabs button[aria-selected="true"]{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
main{padding:14px 14px 60px;max-width:720px;margin:0 auto}
h2{font-size:18px;margin:6px 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.sect{font-size:12px;color:var(--muted);margin:18px 0 6px;letter-spacing:.04em}
.mapwrap{position:relative;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.mapwrap img{display:block;width:100%}
.hs{position:absolute;width:8%;padding-bottom:8%;transform:translate(-50%,-50%);
 border-radius:50%;background:transparent}
.hs:active{background:rgba(37,99,235,.25)}
.note{font-size:12px;color:var(--muted);margin-top:6px}
a.btn{display:block;margin-top:10px;padding:12px;border:1px solid var(--pri);border-radius:6px;
 color:var(--pri);font-size:14px;text-decoration:none;text-align:center}
ol.pl{list-style:none;margin:0;padding:0}
ol.pl li a{display:flex;gap:10px;padding:11px 4px;border-bottom:1px solid #eceef1;
 text-decoration:none;color:inherit}
.num{flex:0 0 22px;height:22px;border-radius:5px;background:var(--pri);color:#fff;font-size:12px;
 display:flex;align-items:center;justify-content:center;margin-top:3px}
.pt{font-size:14px}.pd{font-size:12px;color:var(--muted)}
figure{margin:0 0 28px}
.figs figure:last-child{margin-bottom:10px}
.vid{display:block;width:100%;box-sizing:border-box;margin:0 0 16px;text-decoration:none;color:var(--fg)}
.vth{display:block;position:relative;width:100%;height:0;padding-top:56.25%;box-sizing:border-box;border:1px solid var(--bd);border-radius:6px;overflow:hidden;background:#000}
.vth img{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;max-width:none;margin:0;object-fit:cover;border:0;border-radius:0}
.play{position:absolute;left:50%;top:50%;width:64px;height:44px;margin:-22px 0 0 -32px;border-radius:10px;background:rgba(220,0,0,.9)}
.play:after{content:'';position:absolute;left:26px;top:13px;border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent #fff}
.vt{display:block;font-size:13px;font-weight:700;line-height:1.4;margin-top:6px}
.vt.vt-top{margin-top:0;margin-bottom:6px}
figure img{width:100%;border:1px solid var(--bd);border-radius:6px;display:block}
figure a{display:block}
figcaption{font-size:13px;font-weight:700;color:var(--fg);line-height:1.4}
figure.ct figcaption{margin-bottom:6px}
figure.cb figcaption{margin-top:6px}
.tap{font-size:11px;color:var(--muted);margin:-4px 0 8px}
.ph{background:var(--soft);border:1px dashed var(--bd);border-radius:6px;padding:26px 12px;
 font-size:12px;color:var(--muted);text-align:center}
details{border:1px solid var(--bd);border-radius:6px;padding:10px 12px;margin-bottom:8px}
summary{font-size:14px;cursor:pointer}
details p{font-size:14px;margin:8px 0 0;white-space:pre-wrap}
a.lnk{display:flex;align-items:center;gap:8px;padding:11px 12px;margin-bottom:6px;
 border:1px solid var(--bd);border-radius:6px;text-decoration:none;color:var(--fg);font-size:14px}
.kind{flex:0 0 auto;font-size:11px;padding:2px 6px;border-radius:4px;background:var(--soft);
 color:var(--muted);border:1px solid var(--bd)}
.lt{flex:1}
.nav{display:flex;gap:8px;margin-top:24px}
.nav a{flex:1;text-align:center;padding:10px;border:1px solid var(--bd);border-radius:6px;
 text-decoration:none;color:var(--fg);font-size:13px}
#cal{position:fixed;left:0;right:0;bottom:0;background:#111;color:#fff;font-size:13px;
 padding:10px 14px;display:none;z-index:20}
</style>
</head>
<body>
<header>
  <div class="brand">훈련원터 주변 답사</div>
  <nav id="tabs" role="tablist"></nav>
</header>
<main id="view"></main>
<div id="cal"></div>

var tabsEl = document.getElementById('tabs');
var view   = document.getElementById('view');
var calEl  = document.getElementById('cal');

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildTabs(){
  var h = '<button role="tab" data-r="home">HOME</button>';
  for(var i=0;i<POINTS.length;i++){
    h += '<button role="tab" data-r="p'+(i+1)+'">'+(i+1)+'</button>';
  }
  tabsEl.innerHTML = h;
  tabsEl.addEventListener('click', function(e){
    var b = e.target.closest('button');
    if(b){ location.hash = '#/' + b.dataset.r; }
  });
}

function media(list, kind){
  if(!list || !list.length){
    return '<div class="ph">'+kind+' 자료를 준비 중입니다.</div>';
  }
  var top = (CONFIG.captionPosition !== 'bottom');
  var KO = ['가','나','다','라','마','바','사','아','자','차','카','타','파','하'];
  return '<div class="tap">이미지를 누르면 원본이 새 탭에서 열립니다.</div><div class="figs">' + list.map(function(m, n){
    var no = (n < KO.length ? KO[n] : (n+1)) + '. ';
    var cap = '<figcaption>'+no+esc(m.cap)+'</figcaption>';
    var img = '<a href="'+esc(m.src)+'" target="_blank" rel="noopener">'
            + '<img loading="lazy" src="'+esc(m.src)+'" alt="'+esc(m.cap)+'"></a>';
    return '<figure class="'+(top?'ct':'cb')+'">'+(top ? cap+img : img+cap)+'</figure>';
  }).join('') + '</div>';
}

function videoBox(list){
  if(!list || !list.length){ return ''; }
  var h = '<div class="sect">영상</div>';
  var top = (CONFIG.captionPosition !== 'bottom');
  h += list.map(function(v){
    var url = 'https://www.youtube.com/watch?v=' + v.id + (v.start ? '&t=' + v.start + 's' : '');
    return '<a class="vid" href="'+esc(url)+'" target="_blank" rel="noopener">'
         + (top ? '<span class="vt vt-top">'+esc(v.t)+'</span>' : '')
         + '<span class="vth"><img src="https://i.ytimg.com/vi/'+esc(v.id)+'/hqdefault.jpg" referrerpolicy="no-referrer" onerror="if(!this.dataset.f){this.dataset.f=1;this.src=this.src.replace(\'hqdefault\',\'mqdefault\');}" alt="'+esc(v.t)+'">'
         + '<span class="play"></span></span>'
         + (top ? '' : '<span class="vt">'+esc(v.t)+'</span>')
         + '</a>';
  }).join('');
  return h;
}

function linksBox(list){
  if(!list || !list.length){ return ''; }
  var h = '<div class="sect">원문·참고자료</div>';
  h += list.map(function(l){
    return '<a class="lnk" href="'+esc(l.href)+'" target="_blank" rel="noopener">'
         + '<span class="kind">'+esc(l.kind || '링크')+'</span>'
         + '<span class="lt">'+esc(l.t)+'</span></a>';
  }).join('');
  return h;
}

function renderHome(){
  var h = '<div class="mapwrap"><img id="mapimg" src="'+esc(CONFIG.mapImage)+'" alt="답사 약도">';
  if(CONFIG.hotspot){
    for(var k in HOTSPOTS){
      var c = HOTSPOTS[k];
      h += '<a class="hs" href="#/p'+k+'" aria-label="포인트 '+k+'" '
         + 'style="left:'+c[0]+'%;top:'+c[1]+'%"></a>';
    }
  }
  h += '</div>';
  if(CONFIG.mapNote){ h += '<div class="note">'+esc(CONFIG.mapNote)+'</div>'; }
  h += '<a class="btn" href="'+esc(CONFIG.naverFav)+'" target="_blank" rel="noopener">'
     + '네이버지도 즐겨찾기 목록 열기</a>';
  h += '<div class="sect">답사 포인트 9곳</div><ol class="pl">';
  for(var i=0;i<POINTS.length;i++){
    h += '<li><a href="#/p'+(i+1)+'"><span class="num">'+(i+1)+'</span>'
       + '<span><span class="pt">'+esc(POINTS[i].title)+'</span><br>'
       + '<span class="pd">'+esc(POINTS[i].sub)+'</span></span></a></li>';
  }
  h += '</ol>';
  if(CONFIG.homePhotos && CONFIG.homePhotos.length){
    h += '<div class="sect">사진·도표</div>' + media(CONFIG.homePhotos, '사진·도표');
  }
  return h;
}

function renderPoint(i){
  var p = POINTS[i-1];
  var h = '<div class="pd">POINT '+i+'</div><h2>'+esc(p.title)+'</h2>'
        + '<div class="sub">'+esc(p.sub)+'</div>';
  if(p.naver){
    h += '<a class="btn" href="'+esc(p.naver)+'" target="_blank" rel="noopener">'
       + '네이버지도에서 이 지점 열기</a>';
  }
  h += '<div class="sect">사진·도표</div>' + media(p.photos, '사진·도표');
  if(p.charts && p.charts.length){ h += '<div class="sect">도표</div>' + media(p.charts, '도표'); }
  h += videoBox(p.videos);
  h += '<div class="sect">읽기 자료</div>';
  h += (p.readings && p.readings.length)
     ? p.readings.map(function(r){
         return '<details><summary>'+esc(r.t)+'</summary><p>'+esc(r.html)+'</p></details>';
       }).join('')
     : '<div class="ph">읽기 자료를 준비 중입니다.</div>';
  h += linksBox(p.links);
  h += '<div class="nav">';
  h += (i > 1) ? '<a href="#/p'+(i-1)+'">이전 포인트</a>' : '<a href="#/home">HOME</a>';
  h += (i < 9) ? '<a href="#/p'+(i+1)+'">다음 포인트</a>' : '<a href="#/home">HOME</a>';
  return h + '</div>';
}

function setupCalibrate(){
  if(!CONFIG.calibrate){ return; }
  var img = document.getElementById('mapimg');
  if(!img){ return; }
  calEl.style.display = 'block';
  calEl.textContent = '보정 모드: 약도의 번호를 차례로 누르세요.';
  img.parentNode.addEventListener('click', function(e){
    var r = img.getBoundingClientRect();
    var x = ((e.clientX - r.left) / r.width  * 100).toFixed(1);
    var y = ((e.clientY - r.top ) / r.height * 100).toFixed(1);
    calEl.textContent = '좌표: [' + x + ', ' + y + ']';
  });
}

function route(){
  var r = (location.hash || '#/home').replace('#/','');
  view.innerHTML = (r === 'home') ? renderHome() : renderPoint(parseInt(r.slice(1),10) || 1);
  if(r === 'home'){ setupCalibrate(); }
  var bs = tabsEl.querySelectorAll('button');
  for(var i=0;i<bs.length;i++){
    var on = (bs[i].dataset.r === r);
    bs[i].setAttribute('aria-selected', String(on));
    if(on){ bs[i].scrollIntoView({block:'nearest', inline:'center'}); }
  }
  window.scrollTo(0,0);
}

buildTabs();
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
